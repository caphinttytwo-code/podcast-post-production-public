<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>整段试听确认</title>
<style>
*{box-sizing:border-box}body{font:16px/1.8 system-ui,-apple-system,"PingFang SC",sans-serif;background:#f5f3ed;color:#263d36;margin:0}header,main,.player{max-width:1120px;margin:auto;padding:22px}h1{margin:0;font-size:29px}h2{font-size:23px}button,input,textarea,select{font:inherit}button,select,input{border:1px solid #bacbbd;border-radius:8px;padding:7px 12px;background:#fffefa;color:#285b48}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button.primary{background:#285b48;color:white}audio{width:100%;height:38px}.player{position:sticky;top:0;background:#f5f3edf5;border-block:1px solid #dbe1d6;z-index:2}.toolbar,.card{padding:20px;border:1px solid #dbe1d6;border-radius:12px;background:#fffefa;margin-bottom:18px}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.muted{color:#68776f;font-size:13px}.error{color:#a04132;background:#fff0e4;padding:12px;border-radius:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.source{background:#f7f5ee;padding:14px;border-radius:8px;white-space:pre-wrap}.target{background:#f1dfb5}.cut{text-decoration:line-through;color:#a28b7e}textarea{width:100%;padding:10px;border:1px solid #c7d2c0;border-radius:8px;background:#fffefa;min-height:75px}small{color:#68776f}details{margin:14px 0}summary{cursor:pointer;color:#56735b}.actions{border-top:1px solid #dbe1d6;margin-top:20px;padding-top:14px}.row{border-top:1px solid #dbe1d6;padding:14px 0}.hidden{display:none}.badge{font-size:12px;background:#e7eee2;padding:3px 8px;border-radius:6px}@media(max-width:760px){.grid{grid-template-columns:1fr}header,main,.player{padding:16px}}
</style>
<header><span class="badge">整段试听审阅</span><h1>听完整段，再做决定</h1><p class="muted">原稿用于核对；文字校正与音频删改分别记录。未填写不会视为同意删除。</p></header>
<section class="player"><audio id="audio" controls preload="metadata" src="/audio"></audio><div class="controls"><button id="replay">重播</button><button id="pause">暂停</button><select id="speed" aria-label="播放速度"><option value="1">正常 1×</option><option value=".8">慢速 0.8×</option></select><span id="playing" class="muted">点击卡片试听</span></div></section>
<main><div id="error" class="error hidden"></div><div id="recovery" class="toolbar hidden"><p>有未保存的暂存内容。可以先导出保全，再恢复保存。</p><button id="recover">恢复并保存备份</button><button id="project">使用项目记录</button></div><div id="conflict" class="toolbar hidden"><p>同一字段与项目记录冲突。请先导出备份，再明确选择。</p><button id="useLocal">使用本页有改动的字段</button><button id="useServer">保留项目记录</button></div>
<section class="toolbar"><div class="controls"><select id="view" aria-label="浏览范围"><option value="pending">待判断整段</option><option value="all">全部整段</option><option value="text">全文浏览与搜索</option></select><input id="search" placeholder="搜索口播或原稿" aria-label="搜索"><span id="count"></span></div><p id="saveStatus" class="muted">正在读取项目记录…</p><div class="controls"><button id="bulk">采用其余明确建议</button><button id="export">导出确认记录</button><button id="import">导入确认记录</button><input type="file" id="file" accept=".json,application/json" hidden></div></section>
<div class="controls"><button id="previous">上一段</button><span id="position"></span><button id="next">下一段</button></div><section id="content"></section></main>
<script>
const $=s=>document.querySelector(s),audio=$('#audio'),clone=x=>JSON.parse(JSON.stringify(x));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clock=ms=>[Math.floor(ms/3600000),Math.floor(ms/60000)%60,Math.floor(ms/1000)%60].map(x=>String(x).padStart(2,'0')).join(':')+'.'+String(ms%1000).padStart(3,'0');
const sameBinding=(a,b)=>a&&b&&Object.keys(a).length===Object.keys(b).length&&Object.keys(a).every(k=>a[k]===b[k]);
let DATA,STATE,by,storageKey,draft=null,range=null,last=null,current=null,busy=false,conflicted=false;
const status=(s,bad=false)=>{$('#saveStatus').textContent=s;$('#saveStatus').style.color=bad?'#a04132':''};
const error=s=>{$('#error').textContent=s;$('#error').classList.remove('hidden')};
function backup(){if(!storageKey)return;try{localStorage.setItem(storageKey,JSON.stringify({binding:DATA.binding,state:STATE,draft}))}catch{status('浏览器备份失败，请导出记录',true)}}
function archiveDraft(){try{localStorage.setItem(storageKey+'-recovery-'+Date.now(),JSON.stringify({state:STATE,draft}))}catch{error('旧备份无法保全，请先导出；未覆盖浏览器备份');return false}return true}
function resolved(id){return ['keep','delete','adopt'].includes(STATE.items[id].decision)}
function visible(){const q=$('#search').value.trim(),mode=$('#view').value;return DATA.cards.filter(c=>(mode!=='pending'||c.target_ids.some(id=>!resolved(id)))&&(!q||c.context_ids.some(id=>(by.get(id).text+' '+(by.get(id).manuscript_text||'')).includes(q))))}
function begin(operation,extra={}){if(!draft)draft={binding:DATA.binding,base_revision:STATE.revision,base:clone(STATE),operation,changes:{},...extra};else Object.assign(draft,{operation,...extra})}
function edited(id){return draft?.changes[id]||STATE.items[id]}
function setField(id,field,value){begin('item');draft.changes[id]={...clone(edited(id)),[field]:value};backup();status('修改已暂存，选择后保存到项目')}
function operationSummary(x){
 if(DATA.recording_mode!=='synchronized-multitrack'||!x.operation)return '';
 const o=x.operation,rate=DATA.sample_rate;
 const at=n=>Number.isInteger(n)?clock(Math.round(n*1000/rate))+'（'+n+'采样点）':'—';
 const labels={delete:'删除',insert:'插入',replace:'替换',move:'搬移'},fields=[];
 if(o.start_frame!==undefined)fields.push(['原位置',at(o.start_frame)+'—'+at(o.end_frame)]);
 if(o.source_start_frame!==undefined)fields.push(['采用原声',at(o.source_start_frame)+'—'+at(o.source_end_frame)]);
 if(o.at_frame!==undefined)fields.push(['放到原时间轴',at(o.at_frame)]);
 if(o.block_mode)fields.push(['范围方式',o.block_mode==='whole'?'完整块':'已列明的句内精剪']);
 if(o.type!=='delete')fields.push(['块前后缓冲',((o.buffer_frames||0)/rate).toFixed(3)+' 秒／侧']);
 return '<div class="source"><b>已绑定的'+esc(labels[o.type]||o.type)+'方案</b>'+fields.map(([k,v])=>'<div>'+esc(k)+'：'+esc(v)+'</div>').join('')+'</div>';
}
function render(){
 if(!DATA)return;const total=DATA.items.length,done=DATA.items.filter(x=>resolved(x.id)).length;
 $('#count').textContent=`全文已确认 ${done}/${total} · 待定 ${total-done}`;
 const definite=DATA.items.filter(x=>STATE.items[x.id].decision==='pending'&&['keep','delete'].includes(x.suggestion)).length;$('#bulk').textContent='采用其余 '+definite+' 条明确建议';$('#bulk').disabled=busy||conflicted||!definite;$('#import').disabled=busy||conflicted;$('#view').disabled=busy;$('#search').disabled=busy;$('#previous').disabled=busy;$('#next').disabled=busy;$('#recovery').classList.toggle('hidden',!draft||conflicted);
 if($('#view').value==='text'){const q=$('#search').value.trim();const rows=DATA.items.filter(x=>!q||(x.text+' '+(x.manuscript_text||'')).includes(q));$('#position').textContent='全文';$('#content').innerHTML=rows.map(x=>`<article class="card"><div class="muted">${esc(x.id)} · ${clock(x.start_ms)}—${clock(x.end_ms)}</div><p>${esc(x.text)}</p>${operationSummary(x)}<details><summary>原稿对照</summary><p>${esc(x.manuscript_text||'未匹配原稿')}</p></details><button data-listen="${esc(x.id)}">听这一句及前后文</button><select data-decision="${esc(x.id)}" ${busy||conflicted?'disabled':''} aria-label="${esc(x.id)} 音频决定">${[['pending','未确认'],['keep','保留'],['delete','删除'],['uncertain','待定'],...(DATA.recording_mode==='synchronized-multitrack'&&x.operation?[['adopt','采用已展示的剪辑方案']]:[])].map(([v,t])=>`<option value="${v}" ${edited(x.id).decision===v?'selected':''}>${t}</option>`).join('')}</select><label>文字校正<input data-correction="${esc(x.id)}" ${busy||conflicted?'disabled':''} value="${esc(edited(x.id).text_correction)}"></label><button data-save="${esc(x.id)}" ${busy||conflicted?'disabled':''}>保存本条文字与决定</button></article>`).join('');return}
 const list=visible();if(!list.some(c=>c.id===current))current=list[0]?.id;const c=list.find(c=>c.id===current);$('#position').textContent=c?`${list.indexOf(c)+1}/${list.length} 段`:'本筛选下没有卡片';
 if(!c){$('#content').innerHTML='<article class="card"><h2>本轮整段已处理</h2><p>请核对上方全文待定数量；其余明确建议只有在你明确采用后才算确认。</p></article>';return}
 $('#content').innerHTML=`<article class="card" data-card-id="${c.id}"><div class="muted">${c.id} · ${clock(c.start_ms)}—${clock(c.end_ms)}</div><h2>${esc(c.title)}</h2><button id="listen">▶ 听这一整段</button><div class="grid"><section><h3>实际口播与上下文</h3><div class="source">${c.context_ids.map(id=>`<span class="${c.target_ids.includes(id)?'target':STATE.items[id].decision==='delete'?'cut':''}">${esc(by.get(id).text)}</span>`).join('')}</div><small>琥珀色是本卡可修改的内容；上下文不随本卡决定改变。</small><details><summary>原稿对照</summary>${[...new Set(c.target_ids.map(id=>by.get(id).manuscript_text||'未匹配原稿'))].map(t=>`<p>${esc(t)}</p>`).join('')}</details></section><section><h3>处理理由</h3>${c.target_ids.map(id=>operationSummary(by.get(id))).join('')}${c.target_ids.map(id=>`<p>${esc(by.get(id).reason||'需要结合上下文判断')}</p>`).join('')}<label>本段备注<textarea id="note" ${busy||conflicted?'disabled':''}>${esc(edited(c.target_ids[0]).note)}</textarea></label><details><summary>单独校正文字（不改变音频）</summary>${c.target_ids.map(id=>`<label class="row">${esc(by.get(id).text)}<input data-correction="${esc(id)}" ${busy||conflicted?'disabled':''} value="${esc(edited(id).text_correction)}" placeholder="只填文字校正"></label>`).join('')}</details></section></div>${c.takes.length?'<details><summary>各次重录分别试听</summary>'+c.takes.map((t,i)=>`<p><button data-take="${i}">试听第 ${i+1} 次</button> ${esc(t.text)}</p>`).join('')+'</details>':''}<div class="actions controls">${Object.keys(c.proposal).length?'<button data-action="proposal" class="primary">采用本段建议</button>':''}<button data-action="keep">待判断内容保留</button>${DATA.recording_mode==='synchronized-multitrack'&&c.target_ids.some(id=>by.get(id).operation&&by.get(id).operation.type!=='delete')?'':'<button data-action="delete">待判断内容删除</button>'}<button data-action="custom">按备注处理（仍待定）</button><button data-action="uncertain">暂时拿不准</button><button data-action="pending">撤回本卡决定</button></div></article>`;
 $('#listen').onclick=()=>play(c.start_ms,c.end_ms,c.id);$('#note').oninput=e=>{for(const id of c.target_ids)setField(id,'note',e.target.value)};
 document.querySelectorAll('[data-action]').forEach(b=>{b.disabled=busy||conflicted;b.onclick=()=>decide(c,b.dataset.action)});
 document.querySelectorAll('[data-take]').forEach(b=>b.onclick=()=>{const t=c.takes[+b.dataset.take];play(t.start_ms,t.end_ms,'重录试听')});
}
function play(s,e,label){range={s,e,label};last=range;audio.currentTime=s/1000;audio.play().catch(()=>error('音频播放失败，请核对本机服务'));$('#playing').textContent=label+' · '+clock(s)+'—'+clock(e)}
audio.ontimeupdate=()=>{if(range&&audio.currentTime*1000>=range.e){audio.pause();range=null}};$('#replay').onclick=()=>last&&play(last.s,last.e,last.label);$('#pause').onclick=()=>audio.pause();$('#speed').onchange=e=>audio.playbackRate=+e.target.value;
async function persist(advance=false){
 if(busy||conflicted||!draft)return false;busy=true;render();backup();status('正在保存到项目…');
 const next=visible()[visible().findIndex(c=>c.id===current)+1]?.id;
 try{const res=await fetch('/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(draft)}),body=await res.json();
  if(res.status===409){conflicted=true;$('#conflict').classList.remove('hidden');throw Error('存在同字段冲突，未覆盖项目')}
  if(!res.ok)throw Error(body.error||'保存失败');STATE=body;draft=null;backup();$('#error').classList.add('hidden');$('#recovery').classList.add('hidden');status('已保存到项目 · 第 '+STATE.revision+' 次');if(advance)current=next||null;return true
 }catch(e){status((e.message==='Failed to fetch'?'服务连接已断开，尚未保存':e.message)+'；本页备份仍保留，请先导出',true);return false}finally{busy=false;render()}
}
async function decide(c,action){
 if(draft&&Object.keys(draft.changes).some(id=>!c.target_ids.includes(id))){error('另有未保存内容，请先恢复保存或导出备份');return}
 const note=$('#note').value;if(action==='custom'&&!note.trim()){error('请填写本段处理备注');return}
 begin('card',{card_id:c.id,action});for(const id of c.target_ids)draft.changes[id]={...clone(edited(id)),note,decision:action==='proposal'?c.proposal[id]:action==='custom'?'uncertain':action};backup();await persist(true)
}
document.addEventListener('input',e=>{if(e.target.dataset.correction)setField(e.target.dataset.correction,'text_correction',e.target.value)});
document.addEventListener('change',async e=>{const id=e.target.dataset.decision;if(id){if(draft&&Object.keys(draft.changes).some(x=>x!==id)){error('请先保存已有修改');render();return}begin('item');draft.changes[id]={...clone(edited(id)),decision:e.target.value};backup();await persist()}});
document.addEventListener('click',async e=>{const id=e.target.dataset.listen;if(id){const x=by.get(id);play(Math.max(0,x.start_ms-5000),Math.min(DATA.duration_ms,x.end_ms+5000),id)}const save=e.target.dataset.save;if(save){begin('item');if(!draft.changes[save])draft.changes[save]=clone(STATE.items[save]);await persist()}});
$('#bulk').onclick=async()=>{if(draft){error('请先保存已有修改或恢复备份');return}const ids=DATA.items.filter(x=>STATE.items[x.id].decision==='pending'&&['keep','delete'].includes(x.suggestion)).map(x=>x.id);if(!ids.length)return;begin('bulk',{authorization:{intent:'adopt-definite-suggestions',ids}});for(const id of ids)draft.changes[id]={...STATE.items[id],decision:by.get(id).suggestion};await persist()};
$('#view').onchange=()=>{current=null;render()};$('#search').oninput=()=>{current=null;render()};$('#previous').onclick=()=>move(-1);$('#next').onclick=()=>move(1);function move(n){if(draft){error('请先保存当前修改或导出备份');return}const list=visible(),i=list.findIndex(c=>c.id===current);current=list[Math.max(0,Math.min(list.length-1,i+n))]?.id;render()}
$('#export').onclick=()=>{if(!DATA)return;const value={schema:'paragraph-review-backup-v1',binding:DATA.binding,state:STATE,draft},blob=new Blob([JSON.stringify(value,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='paragraph-review-'+DATA.version+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)};
$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{try{const input=JSON.parse(await e.target.files[0].text());if(input.schema!=='paragraph-review-backup-v1'||!sameBinding(input.binding,DATA.binding)||!sameBinding(input.state?.binding,DATA.binding))throw Error('备份不属于本次素材或卡片版本');if(draft&&!archiveDraft())return;draft=input.draft||{binding:DATA.binding,base_revision:input.state.revision,base:input.state,changes:input.state.items};draft.operation='import';draft.authorization={intent:'restore-backup',ids:Object.keys(draft.changes)};backup();status('备份已载入暂存；点击“恢复并保存备份”后写入项目');render()}catch(e){error(e.message)}finally{e.target.value=''}};
$('#recover').onclick=async()=>{if(!draft)return;draft.operation='import';draft.authorization={intent:'restore-backup',ids:Object.keys(draft.changes)};await persist()};
async function useProject(){try{if(draft&&!archiveDraft())return;const res=await fetch('/progress');if(!res.ok)throw Error();STATE=await res.json();draft=null;conflicted=false;backup();$('#recovery').classList.add('hidden');$('#conflict').classList.add('hidden');$('#error').classList.add('hidden');status('已载入项目记录 · 第 '+STATE.revision+' 次');render()}catch{status('读取项目失败，尚未覆盖本页备份',true)}}
$('#project').onclick=useProject;$('#useServer').onclick=useProject;
$('#useLocal').onclick=async()=>{if(!draft)return;if(!archiveDraft())return;const server=await(await fetch('/progress')).json(),changes={};for(const [id,record]of Object.entries(draft.changes)){changes[id]=clone(server.items[id]);for(const field of ['decision','text_correction','note'])if(record[field]!==draft.base.items[id][field])changes[id][field]=record[field]}draft={binding:DATA.binding,base_revision:server.revision,base:server,operation:'import',changes,authorization:{intent:'restore-backup',ids:Object.keys(changes)}};conflicted=false;$('#conflict').classList.add('hidden');await persist()};
window.addEventListener('beforeunload',backup);window.addEventListener('pagehide',backup);
(async()=>{try{DATA=await(await fetch('/data')).json();STATE=await(await fetch('/progress')).json();by=new Map(DATA.items.map(x=>[x.id,x]));storageKey='paragraph-review-'+DATA.binding.data_sha256+'-'+DATA.binding.source_sha256+'-'+DATA.binding.manuscript_sha256;const cache=JSON.parse(localStorage.getItem(storageKey)||'null');if(cache?.draft&&sameBinding(cache.binding,DATA.binding)){draft=cache.draft;$('#recovery').classList.remove('hidden');status('发现尚未保存的浏览器备份',true)}else status('已读取项目记录 · 第 '+STATE.revision+' 次');render()}catch(e){error('本机服务未连接，请重新运行 review.py launch；保留旧页面以导出备份')}setInterval(async()=>{try{const r=await fetch('/health');if(!r.ok)throw Error()}catch{status('本机服务已断开；修改仍保留在本页，请导出备份',true)}},15000)})();
</script></html>
